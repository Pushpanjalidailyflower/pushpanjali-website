<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pushpanjali | Product Editor</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="site-header"><a class="brand" href="/"><img class="brand-logo" src="/assets/pushpanjali-logo.png" alt="Pushpanjali logo"></a><a class="admin-link" href="/">Customer website</a></header>
<main class="admin-main"><section class="admin-intro"><p class="eyebrow">PRIVATE OWNER AREA</p><h1>Manage products</h1><p>Update product names, prices and photos. Saved changes will appear on the customer website.</p></section>
<section id="login-box" class="checkout-panel login-box"><h2>Owner sign in</h2><label>Admin password<input id="admin-password" type="password" autocomplete="current-password" placeholder="Enter your password"></label><p id="login-error" class="error"></p><button id="login-button" class="button button-main full">Sign in</button></section>
<section id="editor" class="editor hidden"><section class="category-manager"><div class="editor-top"><h2>Item Categories</h2><button id="add-category" class="button button-main">+ Add category</button></div><p class="muted">Create your own categories. Assign each product to a category below.</p><div id="category-list"></div></section><div class="editor-top product-editor-top"><h2>Products</h2><div><button id="add-product" class="button button-main">+ Add product</button><button id="save-products" class="button button-light">Save changes</button></div></div><p id="save-status" class="muted"></p><div id="editor-list"></div><button id="logout-button" class="text-button">Sign out</button></section></main>
<script src="/admin.js"></script></body></html>
